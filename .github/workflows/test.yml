name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim: [v0.11.5, stable, nightly]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - run: git clone --depth 1 https://github.com/lewis6991/gitsigns.nvim ../gitsigns.nvim
      - run: make test
